# =============================================================================
# reSpeaker Flex linear array — l16k2ch firmware example
#
# Target XMOS firmware: respeaker_flex_i2s_l16k2ch_v1.0.4.bin
# (linear 4-mic array, 16 kHz, two processed channels, XMOS I2S master)
#
# Flash the XMOS firmware via USB DFU before using this configuration.
# See: https://github.com/respeaker/reSpeaker_Flex
#
# Before you build this file, put a secrets.yaml next to it:
#   wifi_ssid: "your-ssid"
#   wifi_password: "your-password"
#   api_key: "your-api-encryption-key"
#   ota_password: "your-ota-password"
# =============================================================================

substitutions:
  name: respeaker-flex-l16
  friendly_name: reSpeaker Flex L16 Assistant

  # Release of this repository. Use a tag (e.g. v1.0.0) for stability,
  # or "main" for the latest code.
  flex_ref: main

packages:
  flex:
    url: https://github.com/Wkstr/Respeaker-Flex-ESPHome-integration
    ref: ${flex_ref}
    refresh: 1d
    files:
      - packages/base.yaml
      - packages/hardware.yaml
      - packages/voice-assistant.yaml
      - packages/no-leds.yaml

# A remote package cannot read secrets, so the credentials go here.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    id: ota_esphome
    password: !secret ota_password
