# =============================================================================
# reSpeaker Flex satellite — hardware package (48 kHz firmware)
#
# Use this package for Flex 48k firmware images (c48k2ch / l48k2ch).
# Verified working: 48 kHz I2S, decimator 48k→16k for the voice pipeline.
#
# If you get noise or no audio, your firmware may actually run at 16 kHz
# (some early Flex 48k images — see reSpeaker_Flex issue #2). Use the
# 16k hardware.yaml package instead in that case.
#
# Differences from hardware.yaml (16 kHz):
# - I2S sample rate: 48000 (not 16000)
# - Decimator: 48k→16k for the voice pipeline
# - Speaker resampler: 48 kHz (not 16 kHz)
# =============================================================================

esphome:
  on_boot:
    - priority: 600
      then:
        - lambda: |-
            if (!id(respeaker).is_failed()) {
              id(dsp_status).publish_state("OK");
            } else if (!id(dsp_status).has_state()) {
              id(dsp_status).publish_state("No response");
            }

i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin:
      number: GPIO7
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO8
      allow_other_uses: true

  - id: i2s_input
    i2s_lrclk_pin:
      number: GPIO7
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO8
      allow_other_uses: true

microphone:
  # Raw 48 kHz capture from the XMOS DSP.
  - platform: i2s_audio
    id: i2s_mics_raw
    i2s_din_pin: GPIO43
    adc_type: external
    pdm: false
    sample_rate: 48000
    bits_per_sample: 32bit
    i2s_mode: secondary
    i2s_audio_id: i2s_input
    channel: stereo
  # Decimate 48k→16k for the voice pipeline. The DSP output has no content
  # above 8 kHz, so this keeps 1 frame of 3 with no filter.
  - platform: decimator
    id: i2s_mics
    microphone:
      microphone: i2s_mics_raw
      channels: [0, 1]

speaker:
  # Hardware speaker output at 48 kHz.
  - platform: i2s_audio
    id: i2s_audio_speaker
    sample_rate: 48000
    i2s_mode: secondary
    i2s_dout_pin: GPIO44
    bits_per_sample: 32bit
    i2s_audio_id: i2s_output
    dac_type: external
    channel: stereo
    timeout: never
    buffer_duration: 100ms

  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_audio_speaker
    num_channels: 2
    task_stack_in_psram: true
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

respeaker_xvf3800:
  id: respeaker
  address: 0x2C
  dfu_version:
    name: "Firmware Version"
    update_interval: 120s

globals:
  - id: factory_reset_phase
    type: int
    restore_value: no
    initial_value: '0'

text_sensor:
  - platform: template
    id: dsp_status
    name: "DSP Status"
    entity_category: diagnostic
    icon: "mdi:chip"
    update_interval: never

switch:
  - platform: template
    id: mic_mute_switch
    name: "Microphone Mute"
    icon: "mdi:microphone-off"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - microphone.mute: i2s_mics_raw
      - if:
          condition:
            and:
              - lambda: return !id(init_in_progress);
              - switch.is_on: mute_sound
          then:
            - script.execute:
                id: play_sound
                priority: false
                sound_file: "mute_switch_on_sound"
      - script.execute: control_leds
    on_turn_off:
      - microphone.unmute: i2s_mics_raw
      - if:
          condition:
            and:
              - lambda: return !id(init_in_progress);
              - switch.is_on: mute_sound
          then:
            - script.execute:
                id: play_sound
                priority: false
                sound_file: "mute_switch_off_sound"
      - script.execute: control_leds

number:
  - platform: template
    name: "ASR output gain"
    id: asr_out_gain
    optimistic: true
    restore_value: yes
    initial_value: 1.0
    min_value: 1.0
    max_value: 8.0
    step: 0.1
    entity_category: config
    icon: "mdi:microphone-message"
    on_value:
      - lambda: id(respeaker).set_asr_out_gain(x);

  - platform: template
    name: "AGC max gain (comms)"
    id: agc_max_gain
    optimistic: true
    restore_value: yes
    initial_value: 32.0
    min_value: 1.0
    max_value: 125.0
    step: 1
    entity_category: config
    icon: "mdi:auto-fix"
    on_value:
      - lambda: id(respeaker).set_agc_max_gain(x);

select:
  - platform: template
    name: "DSP route"
    id: dsp_route
    optimistic: true
    restore_value: yes
    initial_option: "Comms to STT, ASR to wake word"
    entity_category: config
    icon: "mdi:call-split"
    options:
      - "ASR to STT and wake word"
      - "Comms to STT, ASR to wake word"
    on_value:
      - lambda: id(respeaker).set_asr_route(i == 0);
