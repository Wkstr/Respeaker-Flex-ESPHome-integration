# =============================================================================
# reSpeaker Flex satellite — hardware package
#
# Board-fixed configuration: I2S buses and pins, microphone, speaker chain,
# and the XMOS XVF3800 DSP.
#
# Do not change the pins. They are fixed by the Flex board layout.
# The same pin map applies to both circular (c*) and linear (l*) Flex arrays.
#
# Key differences from formatBCE's XVF3800 4-Mic Array:
# - I2S runs at 16 kHz (not 48 kHz). Even the "48k" Flex firmware images
#   actually clock I2S at 16 kHz — see reSpeaker_Flex issue #2.
# - No decimator: the XMOS outputs 16 kHz directly, no 48k-to-16k step.
# - No AIC3104 DAC control: the codec is owned by the XMOS firmware.
# - No LED ring, no mute button on the Flex.
# - Microphone mute is done in ESPHome software (microphone.mute), not by
#   writing X0D30 (which is the Flex amplifier SD/FAULT line, not a mic mute).
# - No automatic XMOS DFU: the Flex firmware is provided by Seeed Studio.
# =============================================================================

esphome:
  on_boot:
    - priority: 600
      then:
        - lambda: |-
            if (!id(respeaker).is_failed()) {
              id(dsp_status).publish_state("OK");
            } else if (!id(dsp_status).has_state()) {
              id(dsp_status).publish_state("No response");
            }

i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin:
      number: GPIO7
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO8
      allow_other_uses: true

  - id: i2s_input
    i2s_lrclk_pin:
      number: GPIO7
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO8
      allow_other_uses: true

microphone:
  # The XMOS Flex firmware (both 16k and 48k images) clocks I2S at 16 kHz.
  # The XVF3800 is the I2S master; the ESP32-S3 is the secondary.
  # Two processed channels: ch0 = comms (AEC), ch1 = ASR.
  - platform: i2s_audio
    id: i2s_mics
    i2s_din_pin: GPIO43
    adc_type: external
    pdm: false
    sample_rate: 16000
    bits_per_sample: 32bit
    i2s_mode: secondary
    i2s_audio_id: i2s_input
    channel: stereo

speaker:
  # Hardware speaker output at 16 kHz.
  - platform: i2s_audio
    id: i2s_audio_speaker
    sample_rate: 16000
    i2s_mode: secondary
    i2s_dout_pin: GPIO44
    bits_per_sample: 32bit
    i2s_audio_id: i2s_output
    dac_type: external
    channel: stereo
    timeout: never
    buffer_duration: 100ms
    # No audio_dac: the AIC3104 is owned by the XMOS firmware.
    # ESPHome applies software volume only.

  # Virtual speakers to combine announcement and media streams.
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_audio_speaker
    num_channels: 2
    task_stack_in_psram: true
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  # Resample each pipeline to 16 kHz for the mixer.
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 16000
    bits_per_sample: 16
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 16000
    bits_per_sample: 16

respeaker_xvf3800:
  id: respeaker
  address: 0x2C
  dfu_version:
    name: "Firmware Version"
    update_interval: 120s
  # Deliberately omitted:
  # - firmware: never auto-update the Flex XMOS image. Seeed provides the
  #   firmware; flashing the wrong image can break the array geometry.
  # - mute_switch: X0D30 on the Flex is the amplifier SD/FAULT line, not a
  #   microphone mute. Use the ESPHome software mute below instead.
  # - mute_button and led_beam_sensor: the Flex has neither.

globals:
  # Mute button hold phases (kept for compatibility with the core's factory
  # reset logic, but never triggered since the Flex has no mute button).
  - id: factory_reset_phase
    type: int
    restore_value: no
    initial_value: '0'

text_sensor:
  # Result of the DSP firmware check at boot: OK or No response.
  - platform: template
    id: dsp_status
    name: "DSP Status"
    entity_category: diagnostic
    icon: "mdi:chip"
    update_interval: never

switch:
  # Microphone mute at ESPHome's MicrophoneSource level: callbacks receive
  # zero-filled buffers. This covers both HA STT and micro_wake_word without
  # touching the Flex amplifier GPIO.
  - platform: template
    id: mic_mute_switch
    name: "Microphone Mute"
    icon: "mdi:microphone-off"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - microphone.mute: i2s_mics
      - if:
          condition:
            and:
              - lambda: return !id(init_in_progress);
              - switch.is_on: mute_sound
          then:
            - script.execute:
                id: play_sound
                priority: false
                sound_file: "mute_switch_on_sound"
      - script.execute: control_leds
    on_turn_off:
      - microphone.unmute: i2s_mics
      - if:
          condition:
            and:
              - lambda: return !id(init_in_progress);
              - switch.is_on: mute_sound
          then:
            - script.execute:
                id: play_sound
                priority: false
                sound_file: "mute_switch_off_sound"
      - script.execute: control_leds

number:
  # Gain on the ASR output. It always affects wake word; it affects STT only
  # when the route sends the ASR output to STT.
  - platform: template
    name: "ASR output gain"
    id: asr_out_gain
    optimistic: true
    restore_value: yes
    initial_value: 1.0
    min_value: 1.0
    max_value: 8.0
    step: 0.1
    entity_category: config
    icon: "mdi:microphone-message"
    on_value:
      - lambda: id(respeaker).set_asr_out_gain(x);

  # Maximum gain of the comms path's AGC. The comms output feeds STT on the
  # default route, so this raises STT there; it does not affect the ASR output.
  - platform: template
    name: "AGC max gain (comms)"
    id: agc_max_gain
    optimistic: true
    restore_value: yes
    initial_value: 32.0
    min_value: 1.0
    max_value: 125.0
    step: 1
    entity_category: config
    icon: "mdi:auto-fix"
    on_value:
      - lambda: id(respeaker).set_agc_max_gain(x);

select:
  # channel 0 -> STT, channel 1 -> micro_wake_word.
  - platform: template
    name: "DSP route"
    id: dsp_route
    optimistic: true
    restore_value: yes
    initial_option: "Comms to STT, ASR to wake word"
    entity_category: config
    icon: "mdi:call-split"
    options:
      - "ASR to STT and wake word"
      - "Comms to STT, ASR to wake word"
    on_value:
      - lambda: id(respeaker).set_asr_route(i == 0);
